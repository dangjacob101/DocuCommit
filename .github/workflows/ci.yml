name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Unit, integration, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Frank/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install backend dependencies
        run: make backend-deps

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Run backend and frontend tests
        run: make test

      - name: Build frontend
        working-directory: client
        run: npm run build

  end-to-end:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Frank/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install backend dependencies
        run: make backend-deps

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        env:
          CI: "true"
        run: make e2e
